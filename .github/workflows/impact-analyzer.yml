name: Codebase Impact Analyzer

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the complete Git history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run all tests
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/sample_project
        run: |
          python -m unittest discover \
            -s sample_project/tests \
            -t . \
            -p "test*.py" \
            -v

      # 5. Run Codebase Impact Analyzer
      - name: Run Impact Analyzer
        env:
          PYTHONPATH: ${{ github.workspace }}/sample_project
        run: |
          python main.py \
            --repo sample_project \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --ci \
            --fail-on high