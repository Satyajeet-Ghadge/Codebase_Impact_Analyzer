name: Codebase Impact Analyzer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-analyze:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout main repository and its submodule
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run project tests
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/sample_project
        run: |
          python -m unittest discover \
            -s sample_project/tests \
            -t sample_project \
            -p "test*.py" \
            -v

      # 5. Run Codebase Impact Analyzer
      - name: Run Impact Analyzer
        env:
          PYTHONPATH: ${{ github.workspace }}/sample_project
        run: |
          python main.py \
            --repo sample_project \
            --commit HEAD